<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DesignThink Lab | แบบทดสอบ</title><style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f6f7fb;color:#172033}.wrap{max-width:820px;margin:auto;padding:28px 18px}.brand{font-weight:800;color:#5b5ce2;font-size:22px}.card{background:#fff;border:1px solid #e6e8f0;border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 8px 30px rgba(31,38,64,.05)}.q{padding:18px 0;border-bottom:1px solid #eee}.q:last-child{border:0}.choice{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:12px;background:#fff;cursor:pointer}.choice:hover{border-color:#5b5ce2}.choice.selected{background:#f0efff;border-color:#5b5ce2}.btn{background:#5b5ce2;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.result{font-size:20px;font-weight:800}.small{color:#68738a}.hidden{display:none}</style></head><body><div class="wrap"><div class="brand">DesignThink Lab</div><p class="small">แบบทดสอบความรู้พื้นฐานการคิดเชิงออกแบบ (Design Thinking)</p><div class="card"><h1>แบบทดสอบ</h1><p class="small">เลือกคำตอบที่ดีที่สุด แล้วกด “ส่งคำตอบ”</p><div id="quiz"></div><button class="btn" onclick="submitQuiz()">ส่งคำตอบ</button><div id="result" class="card hidden"></div></div></div><script>
const qs=[
["ขั้นตอนแรกของ Design Thinking คืออะไร?",["Empathize","Prototype","Test","Iterate"],0],
["การ Empathize มีเป้าหมายหลักเพื่ออะไร?",["เข้าใจผู้ใช้และประสบการณ์ของผู้ใช้","สร้างชิ้นงานให้เสร็จเร็ว","เลือกสีของเว็บไซต์","ประเมินคะแนน"],0],
["POV ใช้เพื่ออะไร?",["กำหนดมุมมองของปัญหาจากผู้ใช้","ตกแต่งต้นแบบ","ให้คะแนนผู้เรียน","เก็บไฟล์"],0],
["การ Ideate เน้นอะไร?",["สร้างแนวคิดหรือทางเลือกหลายรูปแบบ","หาคำตอบเดียวทันที","หยุดรับ Feedback","ทำรายงาน"],0],
["Prototype ใน DesignThink Lab เป็นอย่างไร?",["การจำลองแนวทางแก้ปัญหาแบบดิจิทัล","ต้องสร้างชิ้นงานจริงเท่านั้น","การสอบปลายภาค","การสัมภาษณ์ครู"],0],
["ทำไมต้อง Test?",["เพื่อรับ Feedback และตรวจสอบแนวทางกับผู้ใช้","เพื่อจบกระบวนการทันที","เพื่อไม่ต้องปรับปรุง","เพื่อเลือกฟอนต์"],0],
["Iterate หมายถึงอะไร?",["ปรับปรุงแนวทางจากข้อมูลและ Feedback","เริ่มจากศูนย์ทุกครั้ง","หยุดการทดลอง","ท่องจำเนื้อหา"],0],
["หลักคิดสำคัญของ Design Thinking คืออะไร?",["เข้าใจปัญหาและผู้ใช้ก่อนรีบสร้างวิธีแก้","เดาความต้องการผู้ใช้","เลือกวิธีที่แพงที่สุด","ทำตามความคิดของผู้ออกแบบเท่านั้น"],0]
];
let ans=Array(qs.length).fill(null);const quiz=document.getElementById("quiz");
qs.forEach((q,i)=>{let d=document.createElement("div");d.className="q";d.innerHTML="<b>"+(i+1)+". "+q[0]+"</b>";q[1].forEach((o,j)=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>{ans[i]=j;d.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")};d.appendChild(b)});quiz.appendChild(d)});
function submitQuiz(){if(ans.includes(null)){alert("กรุณาตอบให้ครบทุกข้อ");return}let score=ans.reduce((n,a,i)=>n+(a===qs[i][2]?1:0),0),pct=Math.round(score/qs.length*100);let r=document.getElementById("result");r.className="card";r.innerHTML="<div class='result'>ได้ "+score+" / "+qs.length+" คะแนน ("+pct+"%)</div><p>"+(pct>=80?"ผ่านเกณฑ์ ✓":"ยังไม่ถึงเกณฑ์ 80% ลองทบทวนแล้วทำใหม่ได้")+"</p><button class='btn' onclick='location.href="index.html"'>กลับหน้า DesignThink Lab</button>"};</script></body></html>
